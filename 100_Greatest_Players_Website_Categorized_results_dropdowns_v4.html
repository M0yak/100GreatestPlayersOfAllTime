const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const makeList=items=>items.length?'<ul class="items">'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'';
const achievementCell=p=>p.achievement_groups.length?'<details><summary>View achievements ('+p.achievements.length+')</summary>'+p.achievement_groups.map(g=>'<details class="category"><summary>'+esc(g.name)+' ('+g.items.length+')</summary>'+makeList(g.items)+'</details>').join('')+'</details>':'<span class="empty">—</span>';
const resultGroups=[

{name:'Major tournament wins',test:s=>/^(GNT|NCSC|NCWC)\s/.test(s)&&!/^NCSC\s+(?:PO|NCL|GC|SuC|SC)\b/i.test(s)&&!/(?:\s(?:2nd|3rd|4th)(?:\s+place)?)$/i.test(s)},
{name:'Tournament wins',test:s=>/^(1v1|2v2|5v5)\s/.test(s)&&!/(?:\s(?:2nd|3rd|4th)(?:\s+place)?)$/i.test(s)},
{name:'Major tournament 2nd places',test:s=>/^(GNT|NCSC|NCWC)\s.*\s2nd(?:\s+place)?$/i.test(s)},
{name:'Tournament 2nd places',test:s=>/^(1v1|2v2|5v5)\s.*\s2nd(?:\s+place)?$/i.test(s)},
{name:'Major tournament 3rd places',test:s=>/^(GNT|NCSC|NCWC)\s.*\s3rd(?:\s+place)?$/i.test(s)},
{name:'Tournament 3rd places',test:s=>/^(1v1|2v2|5v5)\s.*\s3rd(?:\s+place)?$/i.test(s)},
{name:'Major tournament 4th places',test:s=>/^(GNT|NCSC|NCWC)\s.*\s4th(?:\s+place)?$/i.test(s)},
{name:'Tournament 4th places',test:s=>/^(1v1|2v2|5v5)\s.*\s4th(?:\s+place)?$/i.test(s)},
{name:'Minor NCSC tournament wins',test:s=>/^NCSC\s+(PO|NCL|GC|SuC|SC)\b/i.test(s)}
];
const listCell=(items,label)=>{
if(!items.length)return '<span class="empty">—</span>';
const remaining=[...items];
const groups=resultGroups.map(g=>({name:g.name,items:remaining.filter(x=>g.test(x))})).filter(g=>g.items.length);
groups.forEach(g=>g.items.forEach(x=>remaining.splice(remaining.indexOf(x),1)));
if(remaining.length)groups.push({name:'Other results',items:remaining});
return '<details><summary>'+label+' ('+items.length+')</summary>'+groups.map(g=>'<details class="category"><summary>'+esc(g.name)+' ('+g.items.length+')</summary>'+makeList(g.items)+'</details>').join('')+'</details>';
};
const descCell=t=>t?'<details><summary>Show description</summary><p class="description">'+esc(t)+'</p></details>':'<span class="empty">—</span>';
function render(){const q=document.getElementById('search').value.trim().toLocaleLowerCase();
const filtered=players.filter(p=>[p.place,p.name,...p.achievements,...p.results,p.description].join(' ').toLocaleLowerCase().includes(q));
document.getElementById('rows').innerHTML=filtered.map(p=>'<tr><td class="place">'+esc(p.place)+'</td><td class="name">'+esc(p.name)+'</td><td class="ach">'+achievementCell(p)+'</td><td class="res">'+listCell(p.results,'View results')+'</td><td class="desc">'+descCell(p.description)+'</td></tr>').join('');
document.getElementById('count').textContent='Showing '+filtered.length+' of '+players.length+' players'}
document.getElementById('search').addEventListener('input',render);render();
</script></body></html>
